<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoVPN v1.8</title><style>body{background:#171421;color:#eee;font:18px system-ui;margin:24px;max-width:680px}button{padding:14px;background:#60478e;color:white;border:0;border-radius:8px;font:inherit;margin:5px}progress{width:100%}pre{white-space:pre-wrap;background:#252132;padding:16px}</style><h1>NoVPN v1.8</h1><p>7 минут синтетического звука, 42 сегмента по 10 секунд. Не YouTube. Не закрывайте страницу.</p><button id="start">Начать тест</button><button id="stop">Остановить</button><progress id="progress" max="420" value="0"></progress><p id="stats"></p><pre id="log"></pre><script>
const $=id=>document.getElementById(id);let ctx,gen=0,source,controller,played=0,retries=0,bytes=0,network=0,wait=0;const log=s=>{$('log').textContent=(s+'\n'+$('log').textContent).slice(0,5000)};function stats(){ $('progress').value=played;$('stats').textContent=played+'/420 сек.; повторов: '+retries+'; ожидание буфера: '+(wait/1000).toFixed(1)+' сек.; скорость загрузки: '+(network?Math.round(bytes*8/network):0)+' кбит/с';}
async function load(i,g){for(let j=0;j<3;j++){if(g!==gen)throw Error('stop');const t=performance.now();controller=new AbortController();const c=controller,timer=setTimeout(()=>c.abort(),12000);try{const r=await fetch('https://twitch-music-manager-novpn.vercel.app/api/audio-segment?part='+i,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.arrayBuffer();if(g!==gen)throw Error('stop');bytes+=b.byteLength;network+=performance.now()-t;return await ctx.decodeAudioData(b)}catch(e){if(g!==gen)throw e;retries++;log('Сегмент '+(i+1)+': '+e.message);await new Promise(r=>setTimeout(r,1000*(j+1)))}finally{clearTimeout(timer)}}throw Error('Сегмент недоступен')}
async function run(){const g=++gen;controller?.abort();try{source?.stop()}catch{}if(ctx)await ctx.close().catch(()=>{});ctx=new AudioContext();await ctx.resume();played=retries=bytes=network=wait=0;$('log').textContent='';stats();let pending=load(0,g).then(b=>({b}),e=>({e}));try{for(let i=0;i<42;i++){const t=performance.now(),result=await pending;if(g!==gen)return;if(result.e)throw result.e;wait+=performance.now()-t;const b=result.b;if(i<41)pending=load(i+1,g).then(b=>({b}),e=>({e}));source=ctx.createBufferSource();source.buffer=b;source.connect(ctx.destination);await new Promise(resolve=>{source.onended=resolve;source.start()});if(g!==gen)return;played+=10;stats();log('Сегмент '+(i+1)+'/42 завершён')}log('Тест завершён: 420 секунд')}catch(e){if(g===gen)log('Тест прерван: '+e.message)}}$('start').onclick=()=>run().catch(e=>log(e.message));$('stop').onclick=()=>{gen++;controller?.abort();try{source?.stop()}catch{}log('Остановлено')};
</script></html>
