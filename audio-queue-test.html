<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoVPN v2.0</title><style>body{background:#171421;color:#eee;font:18px system-ui;margin:24px;max-width:680px}button,select{padding:12px;background:#60478e;color:white;border:0;border-radius:8px;font:inherit;margin:5px}progress{width:100%}pre{white-space:pre-wrap;background:#252132;padding:16px}</style><h1>NoVPN v2.0</h1><p>Непрерывная очередь стереозвука, синтетический сигнал. Проверяйте без VPN.</p><select id="duration"><option value="30">30 секунд</option><option value="60" selected>1 минута</option><option value="420">7 минут</option></select><button id="start">Начать</button><button id="stop">Остановить</button><progress id="progress" value="0" max="60"></progress><pre id="stats">Ожидание</pre><script>
const $=id=>document.getElementById(id);let gen=0,ctx,ac;
function stop(){gen++;ac?.abort();if(ctx&&ctx.state!=='closed')ctx.close().catch(()=>{});}
$('stop').onclick=()=>{stop();$('stats').textContent+='\nОстановлено'};
$('start').onclick=async()=>{stop();const g=gen,active=()=>g===gen;const c=new AudioContext({sampleRate:44100});ctx=c;const abort=new AbortController();ac=abort;const duration=Number($('duration').value);$('progress').max=duration;$('progress').value=0;let sent=0,played=0,buffer=0,gaps=0,retries=0,bytes=0,ms=0;const report=(status)=>{if(!active())return;$('progress').value=played;$('stats').textContent=status+'\nВоспроизведено: '+played.toFixed(1)+' / '+duration+' сек.\nЗагружено: '+sent+' сек.\nБуфер: '+buffer.toFixed(1)+' сек.\nРазрывы очереди: '+gaps+'\nПовторы: '+retries+'\nЧастота устройства: '+c.sampleRate+' Гц\nСкорость: '+(ms?Math.round(bytes*8/ms):0)+' кбит/с';};try{await c.resume();await c.audioWorklet.addModule('./audio-queue-v2.js');if(!active())return;const node=new AudioWorkletNode(c,'continuous-audio',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});node.connect(c.destination);node.port.onmessage=e=>{if(!active())return;({played,buffer,gaps}=e.data);report(e.data.done?'Тест завершён':played===0?'Начальная буферизация':'Воспроизведение');if(e.data.done)c.close().catch(()=>{});};report('Загрузка');for(let i=0;i<duration/10;i++){while(active()&&sent-played>=40)await new Promise(r=>setTimeout(r,200));if(!active())return;let b;for(let j=0;active();j++){const t=performance.now();try{const response=await fetch('https://twitch-music-manager-novpn.vercel.app/api/audio-stereo?part='+i,{signal:AbortSignal.any([abort.signal,AbortSignal.timeout(15000)])});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.arrayBuffer();bytes+=data.byteLength;ms+=performance.now()-t;b=await c.decodeAudioData(data);break}catch(e){if(!active())return;retries++;report('Повтор подключения');if(j>=5)throw e;await new Promise(r=>setTimeout(r,Math.min(8000,1000*2**j)));}}if(!active())return;const channels=[new Float32Array(b.getChannelData(0)),new Float32Array(b.getChannelData(1))];node.port.postMessage({type:'chunk',channels},channels.map(x=>x.buffer));sent+=b.duration;}node.port.postMessage({type:'final'});}catch(e){if(active()){stop();$('stats').textContent+='\nОшибка: '+e.message;}}};
</script></html>
