<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoVPN v1.7 — тест звука</title><style>body{background:#171421;color:#eee;font:18px system-ui;margin:24px;max-width:680px}button,audio{margin:12px 0;width:100%}button{padding:14px;background:#60478e;color:white;border:0;border-radius:8px;font:inherit}pre{white-space:pre-wrap;background:#252132;padding:16px;border-radius:8px}</style><h1>NoVPN v1.7</h1><p>Тест передачи звука с Vercel. Сигнал синтезирован сервером, не является музыкой YouTube. Отключите VPN и нажмите кнопку. Громкость умеренная.</p><button id="start">Проверить звук через Vercel</button><audio id="audio" controls preload="none"></audio><pre id="log">Ожидание проверки</pre><p>Успех означает только доступность тестового аудио. Для проверки OBS повторите тест в браузерном доке.</p><script>const a=document.getElementById('audio'),l=document.getElementById('log');let timer,attempt=0,gen=0;function log(s){l.textContent+='\n'+s}function run(g){if(g!==gen)return;attempt++;log('Попытка '+attempt);a.src='https://twitch-music-manager-novpn.vercel.app/api/audio-test?test='+Date.now();a.volume=.35;a.play().catch(e=>log('Play: '+e.message));clearTimeout(timer);timer=setTimeout(()=>{if(g!==gen||a.currentTime>0)return;if(attempt<2)run(g);else log('Тайм-аут: звук не подтверждён')},15000)}document.getElementById('start').onclick=()=>{gen++;clearTimeout(timer);a.pause();attempt=0;l.textContent='Начало проверки';run(gen)};a.onloadedmetadata=()=>log('Метаданные: '+a.duration+' сек.');a.onplaying=()=>log('Плеер начал воспроизведение');let confirmed=false;a.onloadstart=()=>{confirmed=false};a.ontimeupdate=()=>{if(a.currentTime>0.5&&!confirmed){confirmed=true;clearTimeout(timer);log('Воспроизведение подтверждено таймером. Проверьте слышимость.')}};a.onended=()=>log('Тест завершён');a.onerror=()=>log('Ошибка медиа: '+(a.error?.code||'неизвестно'));</script></html>
