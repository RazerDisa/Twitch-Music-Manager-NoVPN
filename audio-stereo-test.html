<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoVPN v1.9</title><style>body{background:#171421;color:#eee;font:18px system-ui;margin:24px;max-width:680px}button{padding:14px;background:#60478e;color:white;border:0;border-radius:8px;font:inherit;margin:5px}progress{width:100%}pre{white-space:pre-wrap;background:#252132;padding:16px}</style><h1>NoVPN v1.9</h1><p>Стерео 44,1 кГц, 7 минут синтетического сигнала. Отключите VPN. Не закрывайте страницу.</p><button id="start">Начать тест</button><button id="stop">Остановить</button><progress id="progress" max="420" value="0"></progress><pre id="stats">Ожидание</pre><script>
const $=id=>document.getElementById(id);let ctx,gen=0,abort,timer;
function stop(){gen++;abort?.abort();clearInterval(timer);if(ctx&&ctx.state!=='closed')ctx.close().catch(()=>{});}
$('stop').onclick=()=>{stop();$('stats').textContent+='\nОстановлено'};
$('start').onclick=async()=>{stop();const g=gen;const c=new AudioContext();ctx=c;const ac=new AbortController();abort=ac;let next=0,end=0,done=0,retries=0,bytes=0,ms=0,gaps=0,target=20,scheduled=0;const active=()=>g===gen;const report=()=>{if(!active())return;$('progress').value=done*10;$('stats').textContent='Завершено: '+done+'/42\nЗапланировано: '+scheduled+'/42\nБуфер: '+Math.max(0,end-c.currentTime).toFixed(1)+' сек.\nЦелевой буфер: '+target+' сек.\nПовторы: '+retries+'\nПаузы планирования: '+gaps.toFixed(2)+' сек.\nСкорость: '+(ms?Math.round(bytes*8/ms):0)+' кбит/с';};try{await c.resume();timer=setInterval(report,500);while(next<42&&active()){if(end-c.currentTime>target){await new Promise(r=>setTimeout(r,200));continue}let b;for(let j=0;j<3;j++){const t=performance.now();try{const response=await fetch('https://twitch-music-manager-novpn.vercel.app/api/audio-stereo?part='+next,{signal:AbortSignal.any([ac.signal,AbortSignal.timeout(15000)])});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.arrayBuffer();bytes+=data.byteLength;ms+=performance.now()-t;b=await c.decodeAudioData(data);if(performance.now()-t>4000)target=40;break}catch(e){if(!active())return;retries++;target=40;if(j===2)throw e;await new Promise(r=>setTimeout(r,1000))}}if(!active())return;const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);const at=Math.max(end,c.currentTime+.05);if(next&&at>end+.051)gaps+=at-end;s.onended=()=>{if(active()){done++;report();if(done===42){clearInterval(timer);$('stats').textContent+='\nТест завершён'}}};s.start(at);end=at+b.duration;next++;scheduled++;report()}}catch(e){if(active()){$('stats').textContent+='\nОшибка: '+e.message;clearInterval(timer)}}};
</script></html>
