<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>NoVPN v2.1</title><style>body{background:#171421;color:#eee;font:18px system-ui;margin:20px;max-width:760px}button,input{padding:10px;margin:6px;max-width:90%;font:inherit}iframe{width:100%;height:280px;border:0}pre{white-space:pre-wrap}</style><h1>NoVPN v2.1 — официальный плеер</h1><p>Проверка без VPN. Вставьте ссылку YouTube. Нажмите Play внутри плеера. Страница не меняет сетевые настройки.</p><input id="url" value="https://www.youtube.com/watch?v=M7lc1UVf-VE"><button id="normal">YouTube</button><button id="privacy">NoCookie</button><button id="auto">Автопроверка</button><div id="frame"></div><pre id="log"></pre><script>
const $=id=>document.getElementById(id);let timer,interval,player,gen=0;const log=s=>$('log').textContent+=s+'\n';function video(){const u=new URL($('url').value);let id=u.hostname==='youtu.be'?u.pathname.slice(1):['www.youtube.com','youtube.com','m.youtube.com'].includes(u.hostname)?u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1]:null;if(!/^[\w-]{11}$/.test(id||''))throw Error('Некорректная ссылка');return id}
let api;function loadAPI(){if(window.YT?.Player)return Promise.resolve();if(api)return api;api=new Promise((resolve,reject)=>{const s=document.createElement('script');const t=setTimeout(()=>{s.remove();reject(Error('API: тайм-аут'))},12000);window.onYouTubeIframeAPIReady=()=>{clearTimeout(t);resolve()};s.onerror=()=>{clearTimeout(t);s.remove();reject(Error('API: ошибка сети'))};s.src='https://www.youtube.com/iframe_api';document.head.append(s)}).catch(e=>{api=null;throw e});return api}
async function run(host,automatic=false){const g=++gen;clearTimeout(timer);clearInterval(interval);try{player?.destroy()}catch{}$('frame').replaceChildren();try{const id=video();log('Маршрут: '+host);const f=document.createElement('iframe');f.src='https://'+host+'/embed/'+id+'?enablejsapi=1&playsinline=1&origin='+encodeURIComponent(location.origin);f.allow='autoplay; encrypted-media; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';f.allowFullscreen=true;$('frame').append(f);await loadAPI();if(g!==gen)return;let verified=false,base=null;player=new YT.Player(f,{events:{onReady:e=>{if(g!==gen)return;log('Плеер готов');if(automatic)e.target.playVideo();interval=setInterval(()=>{if(g!==gen)return;const t=e.target.getCurrentTime();if(e.target.getPlayerState()===1){if(base===null)base=t;if(t-base>=2&&!verified){verified=true;clearTimeout(timer);log('Воспроизведение подтверждено таймером; проверьте звук')}}else base=null;},500)},onError:e=>log('Ошибка YouTube: '+e.data),onAutoplayBlocked:()=>log('Автозапуск запрещён: нажмите Play')}});timer=setTimeout(()=>{if(g!==gen||verified)return;log('Воспроизведение не подтверждено');if(automatic&&host==='www.youtube.com')run('www.youtube-nocookie.com',true)},25000)}catch(e){if(g!==gen)return;log(e.message+'; попробуйте Play вручную, если плеер виден');if(automatic&&host==='www.youtube.com')run('www.youtube-nocookie.com',true)}}
$('normal').onclick=()=>run('www.youtube.com');$('privacy').onclick=()=>run('www.youtube-nocookie.com');$('auto').onclick=()=>{$('log').textContent='';run('www.youtube.com',true)};
</script></html>
